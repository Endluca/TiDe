x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  migrate:
    build:
      context: ./backend
    env_file:
      - ${TIDE_MIGRATION_ENV_FILE:?Set TIDE_MIGRATION_ENV_FILE to a protected migration-only env file}
    environment:
      APP_ENV: production
      TIT_MIGRATION_MODE: "true"
      TIT_MIGRATION_EXPECTED_DATABASE: ${TIDE_MIGRATION_EXPECTED_DATABASE:?Set TIDE_MIGRATION_EXPECTED_DATABASE}
      TIT_DB_POOL_SIZE: "1"
      TIT_DB_MAX_OVERFLOW: "0"
      TIT_DB_POOL_TIMEOUT_SECONDS: "5"
      TIT_DB_APPLICATION_NAME: tit-growth-migrate
      TIT_DB_STATEMENT_TIMEOUT_MS: "0"
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    profiles: ["migration"]
    networks:
      - runtime

  api:
    build:
      context: ./backend
    env_file:
      - ${TIDE_RUNTIME_ENV_FILE:?Set TIDE_RUNTIME_ENV_FILE to a protected runtime-only env file}
    environment:
      APP_ENV: production
      TIT_MIGRATION_MODE: "false"
      TIT_HEALTHCHECK_HOST: ${TIDE_OPS_HOST:?Set TIDE_OPS_HOST}
      TIT_API_WORKERS: ${TIT_API_WORKERS:-2}
      TIT_API_LIMIT_CONCURRENCY: ${TIT_API_LIMIT_CONCURRENCY:-8}
      TIT_API_KEEPALIVE_SECONDS: ${TIT_API_KEEPALIVE_SECONDS:-5}
      TIT_TRUSTED_PROXY_IPS: ${TIDE_WEB_PROXY_IP:?Set the exact Web proxy container IP}
      TIT_DB_POOL_SIZE: ${TIT_API_DB_POOL_SIZE:-5}
      TIT_DB_MAX_OVERFLOW: ${TIT_API_DB_MAX_OVERFLOW:-2}
      TIT_DB_POOL_TIMEOUT_SECONDS: ${TIT_API_DB_POOL_TIMEOUT_SECONDS:-5}
      TIT_DB_POOL_RECYCLE_SECONDS: ${TIT_DB_POOL_RECYCLE_SECONDS:-1800}
      TIT_DB_APPLICATION_NAME: tit-growth-api
      TIT_DB_STATEMENT_TIMEOUT_MS: ${TIT_API_DB_STATEMENT_TIMEOUT_MS:-30000}
    expose:
      - "8010"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:8010/api/health', headers={'Host': os.environ['TIT_HEALTHCHECK_HOST']}); urllib.request.urlopen(request, timeout=3).read()",
        ]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: *default-logging
    networks:
      - runtime

  score-settlement:
    build:
      context: ./backend
    env_file:
      - ${TIDE_RUNTIME_ENV_FILE:?Set TIDE_RUNTIME_ENV_FILE to a protected runtime-only env file}
    environment:
      APP_ENV: production
      TIT_MIGRATION_MODE: "false"
      TIT_DB_POOL_SIZE: ${TIT_SCORE_WORKER_DB_POOL_SIZE:-1}
      TIT_DB_MAX_OVERFLOW: ${TIT_SCORE_WORKER_DB_MAX_OVERFLOW:-0}
      TIT_DB_POOL_TIMEOUT_SECONDS: ${TIT_SCORE_WORKER_DB_POOL_TIMEOUT_SECONDS:-5}
      TIT_DB_POOL_RECYCLE_SECONDS: ${TIT_DB_POOL_RECYCLE_SECONDS:-1800}
      TIT_DB_APPLICATION_NAME: tit-growth-score-worker
      TIT_DB_STATEMENT_TIMEOUT_MS: ${TIT_SCORE_WORKER_DB_STATEMENT_TIMEOUT_MS:-60000}
    command:
      [
        "python",
        "scripts/settle_shared_task_scores.py",
        "--watch",
        "--max-events",
        "25",
        "--interval-seconds",
        "3",
      ]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "scripts/settle_shared_task_scores.py",
          "--healthcheck",
          "--max-heartbeat-age-seconds",
          "90",
        ]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: *default-logging
    networks:
      - runtime

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${TIDE_GATEWAY_BIND_ADDRESS:-127.0.0.1}:${TIDE_HTTPS_TERMINATION_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      runtime:
        ipv4_address: ${TIDE_WEB_PROXY_IP:?Set TIDE_WEB_PROXY_IP}

networks:
  runtime:
    driver: bridge
    ipam:
      config:
        - subnet: ${TIDE_RUNTIME_SUBNET:?Set a non-overlapping runtime subnet}
