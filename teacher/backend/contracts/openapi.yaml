openapi: 3.1.0
info:
  title: TIDE Teacher API Contract
  version: 0.14.0
  description: >-
    教师端公共合同。包含教师端任务、文件和 My TIDE 安全读取；
    各模块实现状态见 contracts/README。任务、G01 状态和外部消息直接使用共享 PostgreSQL 契约表；
    教师积分与逐课积分直接读取世文当前聚合视图，不在教师端重算。
servers:
  - url: http://localhost:3000
    description: local backend
tags:
  - name: Auth
  - name: Tasks
  - name: Files
  - name: TeacherPhoto
  - name: MyTIDE
  - name: Notifications
  - name: FAQ
  - name: SupportTickets
  - name: Analytics
paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: 使用公司邮箱和世文教师编号注册
      operationId: registerTeacher
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '202':
          description: 账号和绑定已创建，等待邮箱验证
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/auth/email-verification/confirm:
    post:
      tags: [Auth]
      summary: 使用一次性令牌验证邮箱
      operationId: confirmEmailVerification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmEmailRequest' }
      responses:
        '200':
          description: 邮箱已验证，重复使用已成功令牌时返回 ALREADY_VERIFIED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailVerificationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/auth/email-verification/resend:
    post:
      tags: [Auth]
      summary: 重新发送邮箱验证邮件
      description: 无论邮箱是否存在均返回相同响应，避免泄露账号状态。
      operationId: resendEmailVerification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResendVerificationRequest' }
      responses:
        '202':
          description: 请求已接受
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResendAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 使用已验证邮箱和密码登录
      operationId: loginTeacher
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 短期访问令牌和一次显示的刷新令牌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenPair' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: 尝试过于频繁 }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: 轮换刷新令牌并签发新访问令牌
      operationId: refreshTeacherSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshSessionRequest' }
      responses:
        '200':
          description: 新令牌对；旧刷新令牌立即失效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokenPair' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: 注销当前会话
      operationId: logoutTeacher
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 当前会话已撤销 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/password-reset/request:
    post:
      tags: [Auth]
      summary: 申请密码重置邮件
      description: 无论邮箱是否存在均返回相同响应，避免泄露账号状态。
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '202':
          description: 请求已接受
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResendAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: 使用一次性令牌设置新密码
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmPasswordResetRequest' }
      responses:
        '200':
          description: 密码已更新，所有既有会话已撤销
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetCompleted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/me/profile:
    get:
      tags: [MyTIDE]
      summary: 获取当前教师账号和训练营安全资料
      operationId: getTeacherProfile
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
        - name: filter
          in: query
          schema: { type: string, enum: [ALL, UNREAD], default: ALL }
      responses:
        '200':
          description: 世文实时资料或最近一次安全缓存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherProfile' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/me/g01-review:
    get:
      tags: [MyTIDE, Tasks]
      summary: 获取 G01 Self-intro 和 TESOL 外部审核安全状态
      operationId: getG01Review
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 后端映射后的教师安全审核状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/G01Review' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/tasks:
    get:
      tags: [Tasks]
      summary: 返回世文已为当前老师创建的共享任务
      operationId: listTeacherTasks
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 共享 assignment 任务列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskListResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/tasks/{taskInstanceId}:
    get:
      tags: [Tasks]
      summary: 获取统一任务上下文
      operationId: getTaskContext
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaskInstanceId'
      responses:
        '200':
          description: 共享任务与本地执行步骤组成的上下文
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskContext' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/tasks/{taskInstanceId}/kuozhi-launch:
    get:
      tags: [Tasks]
      summary: 为当前教师生成阔知课程免登地址
      description: >-
        后端按当前账号绑定的 teacher_id 生成短期课程票证；响应禁止缓存，
        前端不得持有 appkey 对应的 secretKey。一个 TIDE 任务可映射多门课程。
      operationId: getKuozhiCourseLaunch
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaskInstanceId'
      responses:
        '200':
          description: 当前任务的阔知 iframe 免登地址
          headers:
            Cache-Control:
              schema: { type: string, const: 'no-store, max-age=0' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KuozhiLaunchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/tasks/{taskInstanceId}/kuozhi-progress:
    get:
      tags: [Tasks]
      summary: 获取当前任务最近一次阔知进度快照
      operationId: getKuozhiCourseProgress
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaskInstanceId'
      responses:
        '200':
          description: 已归一化的阔知进度；从未刷新时返回 NOT_SYNCED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KuozhiProgressResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/tasks/{taskInstanceId}/kuozhi-progress/refresh:
    post:
      tags: [Tasks]
      summary: 查询阔知并幂等刷新当前任务进度
      description: >-
        teacher_id 和 course_id 均由后端认证绑定与版本化映射取得；只查询并保存正式课程数据。
      operationId: refreshKuozhiCourseProgress
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaskInstanceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MutationMeta' }
      responses:
        '200':
          description: 本次阔知查询、判定与 assignment 更新结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KuozhiProgressResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/v1/tasks/{taskInstanceId}/view:
    post:
      tags: [Tasks]
      summary: 老师主动打开任务详情后标记已查看
      description: 任务列表曝光不得调用此接口。
      operationId: viewTask
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaskInstanceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MutationMeta' }
      responses:
        '200': { $ref: '#/components/responses/TaskMutation' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/tasks/{taskInstanceId}/start:
    post:
      tags: [Tasks]
      summary: 开始任务
      operationId: startTask
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaskInstanceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MutationMeta' }
      responses:
        '200': { $ref: '#/components/responses/TaskMutation' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/tasks/{taskInstanceId}/progress:
    put:
      tags: [Tasks]
      summary: 保存任务步骤进度
      operationId: saveTaskProgress
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaskInstanceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveProgressRequest' }
      responses:
        '200': { $ref: '#/components/responses/TaskMutation' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/tasks/{taskInstanceId}/submissions:
    post:
      tags: [Tasks]
      summary: 提交任务尝试
      operationId: submitTask
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaskInstanceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitTaskRequest' }
      responses:
        '202': { $ref: '#/components/responses/TaskMutation' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/tasks/{taskInstanceId}/validation:
    get:
      tags: [Tasks]
      summary: 查询最近一次验证结果
      operationId: getTaskValidation
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaskInstanceId'
      responses:
        '200':
          description: 验证结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationResult' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/tasks/{taskInstanceId}/teacher-photo:
    post:
      tags: [TeacherPhoto]
      summary: 提交首课摄像头画面，完成四项可见内容检测和私有保存
      operationId: submitTeacherPhoto
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaskInstanceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [photo]
              properties:
                photo: { type: string, format: binary }
      responses:
        '201':
          description: 检测与保存状态；四项通过后不会再要求教师重拍
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherPhotoRun' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [TeacherPhoto]
      summary: 查询当前首课摄像头画面检测和保存状态
      operationId: getTeacherPhoto
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaskInstanceId'
      responses:
        '200':
          description: 最新摄像头画面检测状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeacherPhotoRun' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/tasks/{taskInstanceId}/teacher-photo/content:
    get:
      tags: [TeacherPhoto]
      summary: 读取已鉴权的画面检测证据
      operationId: downloadTeacherPhoto
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaskInstanceId'
      responses:
        '200':
          description: 后台处理并私有保存的画面检测证据
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, no-store' }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/tasks/{taskInstanceId}/retry:
    post:
      tags: [Tasks]
      summary: 创建下一次任务尝试
      operationId: retryTask
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaskInstanceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetryTaskRequest' }
      responses:
        '200': { $ref: '#/components/responses/TaskMutation' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/files/upload-intents:
    post:
      tags: [Files]
      summary: 创建受控文件上传意图
      operationId: createUploadIntent
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadIntentRequest' }
      responses:
        '201':
          description: 上传意图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadIntentResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/files/{fileId}/content:
    put:
      tags: [Files]
      summary: 以流式请求向本地受控上传意图提交文件内容
      operationId: uploadFileContent
      security: [{ bearerAuth: [] }]
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: 文件内容已接收，等待完成确认
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileObject' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { description: 文件超过环境配置的大小限制 }
        '415': { description: 文件 MIME 类型不在允许列表 }
    get:
      tags: [Files]
      summary: 鉴权下载当前老师已就绪的私有文件
      operationId: downloadFileContent
      security: [{ bearerAuth: [] }]
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 私有文件内容
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, no-store' }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/files/{fileId}/complete:
    post:
      tags: [Files]
      summary: 确认上传完成并触发服务端校验
      operationId: completeUpload
      security: [{ bearerAuth: [] }]
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sha256]
              properties:
                sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '200':
          description: 文件状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileObject' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/me/tide-summary:
    get:
      tags: [MyTIDE]
      summary: 读取世文当前教师积分卡
      operationId: getTideSummary
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 直接透传世文当前总分、资格、五维及子项；可获得积分仅由未完成 G 任务生成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TideSummary' }
  /api/v1/me/courses:
    get:
      tags: [MyTIDE]
      summary: 分页读取世文当前逐课积分明细
      operationId: getCourseFacts
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 无历史数据时 items 为空数组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseList' }
  /api/v1/me/notifications:
    get:
      tags: [Notifications]
      summary: 获取教师通知
      operationId: getNotifications
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
        - name: filter
          in: query
          required: false
          schema: { type: string, enum: [ALL, UNREAD], default: ALL }
      responses:
        '200':
          description: 合并返回共享外部消息与 tide 系统消息
          content:
            application/json:
              schema:
                type: object
                required: [items, totalCount, unreadCount, nextCursor, freshness]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  totalCount: { type: integer, minimum: 0 }
                  unreadCount: { type: integer, minimum: 0 }
                  nextCursor: { type: [string, 'null'] }
                  freshness: { $ref: '#/components/schemas/SourceFreshness' }
  /api/v1/me/notifications/{sourceNotificationId}/read:
    post:
      tags: [Notifications]
      summary: 幂等回写外部或系统消息已读状态
      operationId: markNotificationRead
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sourceNotificationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: 已读时间已保存 }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/me/notifications/{sourceNotificationId}/click:
    post:
      tags: [Notifications]
      summary: 幂等回写外部或系统消息点击状态
      operationId: markNotificationClicked
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sourceNotificationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: 点击时间已保存 }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/faq/conversations:
    post:
      tags: [FAQ]
      summary: 获取或创建当前老师的开放 FAQ 会话
      operationId: createFaqConversation
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: 当前开放 FAQ 会话已返回；没有时创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaqConversationCreated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/faq/conversations/{conversationId}:
    get:
      tags: [FAQ]
      summary: 获取当前老师的 FAQ 会话和历史消息
      operationId: getFaqConversation
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 会话、消息和教师可见来源
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaqConversation' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/faq/conversations/{conversationId}/messages:
    post:
      tags: [FAQ]
      summary: 向 FAQ 会话发送纯文字问题
      description: 不接收图片或附件；先在已生效 FAQ 中做英文自然语义匹配，意图不明确时追问，确认未命中时拒绝猜测并记录 Gap。
      operationId: askFaqQuestion
      security: [{ bearerAuth: [] }]
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AskFaqRequest' }
      responses:
        '200':
          description: 保存后的教师消息和安全 FAQ 回答
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaqAnswerResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/faq/messages/{messageId}/feedback:
    post:
      tags: [FAQ]
      summary: 保存当前老师对 FAQ 回答的首次反馈
      operationId: saveFaqFeedback
      security: [{ bearerAuth: [] }]
      parameters:
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FaqFeedbackRequest' }
      responses:
        '200':
          description: 反馈已保存；完全相同的重复请求幂等返回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FaqFeedbackResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/support-tickets:
    get:
      tags: [SupportTickets]
      summary: 读取当前教师工单并在本次刷新中同步运营回复状态
      operationId: listSupportTickets
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 工单列表与未读数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicketList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [SupportTickets]
      summary: 创建教师工单
      operationId: createSupportTicket
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/CreateSupportTicket' }
      responses:
        '201':
          description: 工单已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: 单张截图超过 8 MB }
        '415': { description: 截图格式不支持 }
  /api/v1/support-tickets/{ticketId}:
    get:
      tags: [SupportTickets]
      summary: 读取当前教师的一条工单
      operationId: getSupportTicket
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: 工单详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/support-tickets/{ticketId}/read:
    post:
      tags: [SupportTickets]
      summary: 将当前最新运营回复标为已读
      operationId: markSupportTicketRead
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: 已更新工单
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/support-tickets/{ticketId}/messages:
    post:
      tags: [SupportTickets]
      summary: 教师在未关闭工单中继续补充
      operationId: replySupportTicket
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ReplySupportTicket' }
      responses:
        '200':
          description: 消息已追加
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/support-tickets/{ticketId}/resolve:
    post:
      tags: [SupportTickets]
      summary: 教师确认已解决并由 TIDE 关闭工单
      operationId: resolveSupportTicket
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rowVersion]
              properties:
                rowVersion: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 工单已关闭并触发图片清理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/support-tickets/{ticketId}/images/{fileId}:
    get:
      tags: [SupportTickets]
      summary: 鉴权读取当前教师工单图片
      operationId: getSupportTicketImage
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 私有图片二进制
          content:
            image/jpeg: { schema: { type: string, contentEncoding: binary } }
            image/png: { schema: { type: string, contentEncoding: binary } }
            image/webp: { schema: { type: string, contentEncoding: binary } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/app-events:
    post:
      tags: [Analytics]
      summary: 保存已登录老师的白名单产品分析事件
      description: >-
        事件按 event_id 幂等保存。任务事件必须绑定当前老师拥有的 assignment；
        任务编码、类型、模板版本、执行规则版本、状态和尝试次数由后端权威数据覆盖。
        埋点失败不改变任务、积分或课程业务状态。当前接口独立限流为每分钟 300 次。
      operationId: createAppEvent
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAppEvent' }
      responses:
        '202':
          description: 事件已接受或幂等忽略
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppEventAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: properties 序列化后超过 8 KB }
        '429': { description: 埋点请求过于频繁；客户端按 Retry-After 重试 }
  /api/v1/app-events/anonymous:
    post:
      tags: [Analytics]
      summary: 保存登录前页面与技术异常事件
      description: >-
        只接受 PAGE_VIEWED、PAGE_LOAD_SUCCEEDED、PAGE_LOAD_FAILED、
        NAVIGATION_CLICKED、LANGUAGE_CHANGED、PAGE_EXITED、API_FAILED、
        NETWORK_TIMEOUT、FRONTEND_UNCAUGHT_ERROR，且不得携带 taskAssignmentId。
        当前接口独立限流为每分钟 30 次。
      operationId: createAnonymousAppEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAppEvent' }
      responses:
        '202':
          description: 匿名事件已接受或幂等忽略
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppEventAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { description: properties 序列化后超过 8 KB }
        '429': { description: 匿名埋点请求过于频繁；客户端按 Retry-After 重试 }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TaskInstanceId:
      name: taskInstanceId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    TicketId:
      name: ticketId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    TaskMutation:
      description: 状态变更已持久化
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TaskMutationResponse' }
    Unauthorized:
      description: 未认证或验签失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    BadRequest:
      description: 请求字段格式错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: 资源不存在或不属于当前教师
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: 幂等负载冲突、状态版本冲突或非法状态迁移
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ValidationError:
      description: 请求字段或任务输出不符合合同
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ServiceUnavailable:
      description: 数据源或外部依赖暂时不可用
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, teacherId, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        teacherId: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 12, maxLength: 128 }
    RegistrationAccepted:
      type: object
      additionalProperties: false
      required: [status, verificationEmailSent]
      properties:
        status: { type: string, const: VERIFICATION_REQUIRED }
        verificationEmailSent: { type: boolean }
    ConfirmEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 512 }
    EmailVerificationResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [VERIFIED, ALREADY_VERIFIED]
    ResendVerificationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    ResendAccepted:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted: { type: boolean, const: true }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
    RefreshSessionRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 32, maxLength: 512 }
    AuthTokenPair:
      type: object
      additionalProperties: false
      required: [tokenType, accessToken, accessTokenExpiresIn, refreshToken, refreshTokenExpiresAt]
      properties:
        tokenType: { type: string, const: Bearer }
        accessToken: { type: string }
        accessTokenExpiresIn: { type: integer, minimum: 60 }
        refreshToken: { type: string }
        refreshTokenExpiresAt: { type: string, format: date-time }
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    ConfirmPasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token: { type: string, minLength: 32, maxLength: 512 }
        newPassword: { type: string, minLength: 12, maxLength: 128 }
    PasswordResetCompleted:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: PASSWORD_UPDATED }
    TeacherProfile:
      type: object
      additionalProperties: false
      required: [teacherId, email, name, timezone, campDay, totalCampDays, graduationState, freshness]
      properties:
        teacherId: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        timezone: { type: [string, 'null'] }
        campDay: { type: [integer, 'null'], minimum: 0 }
        totalCampDays: { type: integer, minimum: 1 }
        graduationState: { type: [string, 'null'] }
        freshness: { $ref: '#/components/schemas/SourceFreshness' }
    ExternalReviewStatus:
      type: string
      enum: [WAITING, IN_REVIEW, APPROVED, NEEDS_CHANGES, UNAVAILABLE]
    G01Review:
      type: object
      additionalProperties: false
      required: [selfIntroStatus, tesolStatus, externalStatusesComplete, freshness]
      properties:
        selfIntroStatus: { $ref: '#/components/schemas/ExternalReviewStatus' }
        tesolStatus: { $ref: '#/components/schemas/ExternalReviewStatus' }
        externalStatusesComplete:
          type: boolean
          description: 仅表示 Self-intro 与 TESOL 两项外部状态均完成，不代表 G01 整体完成。
        freshness: { $ref: '#/components/schemas/SourceFreshness' }
    MutationMeta:
      type: object
      additionalProperties: false
      required: [commandId, expectedStateVersion]
      properties:
        commandId: { type: string, minLength: 8, maxLength: 128 }
        expectedStateVersion: { type: integer, minimum: 1 }
    TaskListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskSummary' }
    TaskSummary:
      type: object
      additionalProperties: false
      required: [taskInstanceId, taskCode, kind, status, stateVersion, display, title, priority, availableAt, dueAt, completedAt, dataOrigin]
      properties:
        taskInstanceId: { type: string }
        taskCode: { type: string }
        kind: { type: string, enum: [FIXED_GROWTH, PERSONALIZED_IMPROVEMENT] }
        status: { $ref: '#/components/schemas/TaskStatus' }
        stateVersion: { type: integer, minimum: 1 }
        display: { $ref: '#/components/schemas/TaskDisplayMetadata' }
        title: { type: string }
        priority: { type: string, enum: [P0, P1, P2, P3] }
        availableAt: { type: [string, 'null'], format: date-time }
        dueAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        dataOrigin: { type: string, enum: [REAL, DERIVED_REAL, MOCK, MOCK_SIMULATION, MOCK_PROXY] }
    TaskDisplayMetadata:
      type: object
      additionalProperties: false
      required: [stageKey, sequence, points, estimatedMinutes]
      properties:
        stageKey: { type: [string, 'null'] }
        sequence: { type: [integer, 'null'], minimum: 1 }
        points: { type: number, minimum: 0 }
        estimatedMinutes: { type: [integer, 'null'], minimum: 1 }
    TaskContext:
      type: object
      additionalProperties: false
      required: [taskInstanceId, taskCode, kind, templateVersion, executionContractVersion, status, stateVersion, display, content, steps, progress, capabilities, assignment, availableAt, dueAt, completedAt, dataOrigin]
      properties:
        taskInstanceId: { type: string }
        taskCode: { type: string }
        kind: { type: string, enum: [FIXED_GROWTH, PERSONALIZED_IMPROVEMENT] }
        templateVersion: { type: integer, minimum: 1 }
        executionContractVersion: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        stateVersion: { type: integer, minimum: 1 }
        display: { $ref: '#/components/schemas/TaskDisplayMetadata' }
        content: { $ref: '#/components/schemas/TaskContent' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/TaskStep' }
        progress: { $ref: '#/components/schemas/TaskProgress' }
        capabilities:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/StepType' }
        assignment: { $ref: '#/components/schemas/SharedAssignmentContext' }
        availableAt: { type: [string, 'null'], format: date-time }
        dueAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        dataOrigin: { type: string, enum: [REAL, DERIVED_REAL, MOCK, MOCK_SIMULATION, MOCK_PROXY] }
    KuozhiLaunchResponse:
      type: object
      additionalProperties: false
      required: [provider, dataMode, integrationStatus, mappingVersion, courses]
      properties:
        provider: { type: string, const: KUOZHI }
        dataMode: { type: string, const: REAL }
        integrationStatus: { type: string, enum: [ACTIVE, PARTIAL, MAPPING_ONLY] }
        mappingVersion: { type: integer, minimum: 1 }
        courses:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [courseId, title, embedMode, launchUrl]
            properties:
              courseId: { type: string, pattern: '^\d+$' }
              title: { type: [string, 'null'] }
              embedMode: { type: string, const: IFRAME }
              launchUrl: { type: string, format: uri }
    KuozhiProgressResponse:
      type: object
      additionalProperties: false
      required: [provider, dataMode, integrationStatus, mappingVersion, syncStatus, refreshedAt, courses, completion, assignment]
      properties:
        provider: { type: string, const: KUOZHI }
        dataMode: { type: string, const: REAL }
        integrationStatus: { type: string, enum: [ACTIVE, PARTIAL, MAPPING_ONLY] }
        mappingVersion: { type: integer, minimum: 1 }
        syncStatus: { type: string, enum: [NOT_SYNCED, AVAILABLE, PARTIAL, NO_DATA] }
        refreshedAt: { type: [string, 'null'], format: date-time }
        courses:
          type: array
          items: { $ref: '#/components/schemas/KuozhiProgressCourse' }
        completion:
          type: object
          additionalProperties: false
          required: [enabled, completed, reasonCode]
          properties:
            enabled: { type: boolean }
            completed: { type: boolean }
            reasonCode:
              type: string
              enum: [NOT_SYNCED, COMPLETED, COMPLETION_DISABLED, NO_DATA, REQUIRED_TASK_MISSING, SOURCE_VALUE_INVALID, REQUIREMENTS_INCOMPLETE]
        assignment:
          type: object
          additionalProperties: false
          required: [status, stateVersion, stateUpdated]
          properties:
            status: { $ref: '#/components/schemas/TaskStatus' }
            stateVersion: { type: integer, minimum: 1 }
            stateUpdated: { type: boolean }
    KuozhiProgressCourse:
      type: object
      additionalProperties: false
      required: [courseId, title, sourceAvailable, percent, completed, tasks]
      properties:
        courseId: { type: string, pattern: '^\d+$' }
        title: { type: string }
        sourceAvailable: { type: boolean }
        percent: { type: [number, 'null'], minimum: 0, maximum: 100 }
        completed: { type: boolean }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/KuozhiProgressTask' }
    KuozhiProgressTask:
      type: object
      additionalProperties: false
      required: [courseTaskId, title, type, required, sourceStatus, percent, score, testTimes, completed]
      properties:
        courseTaskId: { type: string, pattern: '^\d+$' }
        title: { type: string }
        type: { type: string, enum: [VIDEO, TESTPAPER] }
        required: { type: boolean }
        sourceStatus: { type: string, enum: [AVAILABLE, MISSING, INVALID] }
        percent: { type: [number, 'null'], minimum: 0, maximum: 100 }
        score: { type: [number, 'null'] }
        testTimes: { type: [number, 'null'], minimum: 0 }
        completed: { type: boolean }
    TaskContent:
      type: object
      additionalProperties: false
      required: [title, why, whatToDo, completionStandard, outcome, language]
      properties:
        title: { type: string }
        why: { type: string }
        whatToDo: { type: string }
        completionStandard: { type: string }
        outcome: { type: string }
        language: { type: string }
    SharedAssignmentContext:
      type: object
      additionalProperties: false
      required: [assignmentId, teacherSafeReason, teacherSafeFacts, relatedCourses, reminderNotificationId, priority, dueAt]
      properties:
        assignmentId: { type: string }
        teacherSafeReason: { type: string }
        teacherSafeFacts:
          type: array
          items: { $ref: '#/components/schemas/TaskTeacherSafeFact' }
        relatedCourses:
          type: array
          items: { $ref: '#/components/schemas/TaskRelatedCourse' }
        reminderNotificationId: { type: [string, 'null'] }
        priority: { type: string, enum: [P0, P1, P2, P3] }
        dueAt: { type: [string, 'null'], format: date-time }
    TaskTeacherSafeFact:
      type: object
      additionalProperties: false
      required: [label, labelZh, value, valueZh]
      properties:
        label: { type: string }
        labelZh: { type: [string, 'null'] }
        value: { type: string }
        valueZh: { type: [string, 'null'] }
    TaskRelatedCourse:
      type: object
      additionalProperties: false
      required: [lessonId, label, labelZh, summary, summaryZh, occurredAt]
      properties:
        lessonId: { type: string }
        label: { type: string }
        labelZh: { type: [string, 'null'] }
        summary: { type: string }
        summaryZh: { type: [string, 'null'] }
        occurredAt: { type: [string, 'null'], format: date-time }
    TaskStep:
      type: object
      additionalProperties: false
      required: [stepKey, position, type, title, config]
      properties:
        stepKey: { type: string }
        position: { type: integer, minimum: 1 }
        type: { $ref: '#/components/schemas/StepType' }
        title: { type: string }
        config: { type: object, additionalProperties: true }
    TaskProgress:
      type: object
      required: [currentStepKey, percent, steps]
      properties:
        currentStepKey: { type: [string, 'null'] }
        percent: { type: integer, minimum: 0, maximum: 100 }
        steps:
          type: array
          items:
            type: object
            required: [stepKey, status, percent]
            properties:
              stepKey: { type: string }
              status: { type: string, enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, FAILED] }
              percent: { type: integer, minimum: 0, maximum: 100 }
    StepType:
      type: string
      enum: [VIDEO, DOCUMENT, CHECKLIST, UPLOAD, DEVICE_CHECK, EXTERNAL_TRAINING, CUSTOM]
    TaskStatus:
      type: string
      enum: [ASSIGNED, VIEWED, IN_PROGRESS, SUBMITTED, UNDER_REVIEW, COMPLETED, FAILED, EXPIRED, WAIVED, CANCELLED]
    SaveProgressRequest:
      type: object
      additionalProperties: false
      required: [commandId, expectedStateVersion, stepKey, percent, progress]
      properties:
        commandId: { type: string, minLength: 8, maxLength: 128 }
        expectedStateVersion: { type: integer, minimum: 1 }
        stepKey: { type: string }
        percent: { type: integer, minimum: 0, maximum: 100 }
        progress: { type: object, additionalProperties: true }
    SubmitTaskRequest:
      type: object
      additionalProperties: false
      required: [commandId, expectedStateVersion, attemptId, outputs]
      properties:
