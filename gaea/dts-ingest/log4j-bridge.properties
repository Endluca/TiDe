log4j.reset=true
log4j.rootLogger=INFO,STDERR

log4j.appender.STDERR=org.apache.log4j.ConsoleAppender
log4j.appender.STDERR.Target=System.err
log4j.appender.STDERR.Threshold=TRACE
log4j.appender.STDERR.ImmediateFlush=true
log4j.appender.STDERR.layout=org.apache.log4j.PatternLayout
log4j.appender.STDERR.layout.ConversionPattern=[%d{yyyy-MM-dd HH:mm:ss.SSS}] [%-5p] [%t] [%c:%L] - %m%n

# stdout is the NDJSON transport protocol. Keep the official Kafka 1.0 client
# timeline on stderr without enabling SASL byte dumps or printing properties.
log4j.logger.com.aliyun.dts.subscribe=INFO
# The pinned SDK renders complete parsed records in these queue/error logs.
# The bridge reports stable error types separately, so suppress only the two
# payload-bearing packages while retaining the Kafka protocol timeline below.
log4j.logger.com.aliyun.dts.subscribe.clients.recordgenerator=OFF
log4j.logger.com.aliyun.dts.subscribe.clients.recordprocessor=OFF
log4j.logger.org.apache.kafka=INFO
log4j.logger.org.apache.kafka.clients.NetworkClient=TRACE
log4j.logger.org.apache.kafka.clients.Metadata=DEBUG
log4j.logger.org.apache.kafka.common.network.Selector=TRACE
log4j.logger.org.apache.kafka.common.network.SaslChannelBuilder=INFO
log4j.logger.org.apache.kafka.common.security.authenticator.SaslClientAuthenticator=TRACE
log4j.logger.org.apache.kafka.clients.consumer.KafkaConsumer=INFO
log4j.logger.org.apache.kafka.clients.consumer.internals.ConsumerNetworkClient=DEBUG
log4j.logger.org.apache.kafka.clients.consumer.internals.Fetcher=DEBUG
log4j.logger.org.apache.kafka.clients.consumer.internals.ConsumerCoordinator=DEBUG
log4j.logger.org.apache.kafka.clients.consumer.internals.SubscriptionState=DEBUG
