log4j.reset=true
log4j.rootLogger=INFO,CONSOLE,FILE

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.Target=System.out
log4j.appender.CONSOLE.Threshold=TRACE
log4j.appender.CONSOLE.ImmediateFlush=true
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=[%d{yyyy-MM-dd HH:mm:ss.SSS}] [%-5p] [%t] [%c:%L] - %m%n

log4j.appender.FILE=org.apache.log4j.RollingFileAppender
log4j.appender.FILE.File=${dts.log.dir}/dts-new-subscribe.log
log4j.appender.FILE.Append=true
log4j.appender.FILE.ImmediateFlush=true
log4j.appender.FILE.Threshold=TRACE
log4j.appender.FILE.MaxFileSize=100MB
log4j.appender.FILE.MaxBackupIndex=5
log4j.appender.FILE.layout=org.apache.log4j.PatternLayout
log4j.appender.FILE.layout.ConversionPattern=[%d{yyyy-MM-dd HH:mm:ss.SSS}] [%-5p] [%t] [%c:%L] - %m%n

# Keep ordinary libraries at INFO, but expose the DTS SDK and the exact Kafka
# protocol timeline needed to distinguish ApiVersions, SASL, Metadata, offset,
# fetch, coordinator and socket failures.
log4j.logger.com.aliyun.dts.subscribe=${tit.dts.diag.log.level}
log4j.logger.org.apache.kafka=DEBUG
log4j.logger.org.apache.kafka.clients.NetworkClient=TRACE
log4j.logger.org.apache.kafka.clients.Metadata=DEBUG
log4j.logger.org.apache.kafka.common.network.Selector=TRACE
log4j.logger.org.apache.kafka.common.network.SaslChannelBuilder=DEBUG
log4j.logger.org.apache.kafka.common.security.JaasContext=DEBUG
log4j.logger.org.apache.kafka.common.security.authenticator.SaslClientAuthenticator=DEBUG
log4j.logger.org.apache.kafka.clients.consumer.KafkaConsumer=DEBUG
log4j.logger.org.apache.kafka.clients.consumer.internals.ConsumerNetworkClient=DEBUG
log4j.logger.org.apache.kafka.clients.consumer.internals.Fetcher=DEBUG
log4j.logger.org.apache.kafka.clients.consumer.internals.SubscriptionState=DEBUG
log4j.logger.org.apache.kafka.clients.consumer.internals.AbstractCoordinator=DEBUG
log4j.logger.org.apache.kafka.clients.consumer.internals.ConsumerCoordinator=DEBUG
