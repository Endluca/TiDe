user gaea;
worker_processes ${NGINX_WORKER_PROCESSES};
error_log stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format tide
        '$remote_addr "$request_method $uri $server_protocol" $status $body_bytes_sent '
        'rt=$request_time urt=$upstream_response_time host="$host"';
    access_log /dev/stdout tide;

    client_body_temp_path /tmp/tide-nginx/client-body;
    proxy_temp_path /tmp/tide-nginx/proxy;
    fastcgi_temp_path /tmp/tide-nginx/fastcgi;
    uwsgi_temp_path /tmp/tide-nginx/uwsgi;
    scgi_temp_path /tmp/tide-nginx/scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    map $http_x_request_id $tide_request_id {
        default $http_x_request_id;
        "" $request_id;
    }

    map $http_x_forwarded_proto $tide_forwarded_proto {
        default $scheme;
        http http;
        https https;
    }

    include /etc/nginx/conf.d/*.conf;
}
