x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-runtime-security: &runtime-security
  read_only: true
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  migrate:
    build:
      context: ../../backend
    env_file:
      - ${TIDE_OPS_MIGRATION_ENV_FILE:?Set TIDE_OPS_MIGRATION_ENV_FILE to a protected env file}
    environment:
      APP_ENV: production
      TIT_MIGRATION_MODE: "true"
      TIT_MIGRATION_EXPECTED_DATABASE: ${TIDE_DATABASE_NAME:?Set TIDE_DATABASE_NAME}
      TIT_DB_POOL_SIZE: "1"
      TIT_DB_MAX_OVERFLOW: "0"
      TIT_DB_POOL_TIMEOUT_SECONDS: "5"
      TIT_DB_APPLICATION_NAME: tit-growth-migrate
      TIT_DB_STATEMENT_TIMEOUT_MS: "0"
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - ops-internal
    profiles: ["migration"]

  teacher-migrate:
    build:
      context: ${TIDE_TEACHER_REPO_PATH:?Set TIDE_TEACHER_REPO_PATH}/backend
      dockerfile: Dockerfile.migrate
    env_file:
      - ${TIDE_TEACHER_MIGRATION_ENV_FILE:?Set TIDE_TEACHER_MIGRATION_ENV_FILE to a protected env file}
    environment:
      TIDE_MIGRATION_EXPECTED_DATABASE: ${TIDE_DATABASE_NAME:?Set TIDE_DATABASE_NAME}
      TIDE_MIGRATION_TARGET: ${TIDE_TEACHER_MIGRATION_TARGET:-0030_remove_unused_columns_and_orphan_function}
    read_only: true
    tmpfs:
      - /tmp:size=32m
    pids_limit: 64
    cpus: 0.25
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *default-logging
    networks:
      - teacher-internal
    profiles: ["migration"]

  api:
    <<: *runtime-security
    build:
      context: ../../backend
    env_file:
      - ${TIDE_OPS_ENV_FILE:?Set TIDE_OPS_ENV_FILE to a protected env file}
    environment:
      APP_ENV: production
      TIT_API_WORKERS: ${TIT_API_WORKERS:-2}
      TIT_API_LIMIT_CONCURRENCY: ${TIT_API_LIMIT_CONCURRENCY:-8}
      TIT_API_KEEPALIVE_SECONDS: ${TIT_API_KEEPALIVE_SECONDS:-5}
      TIT_TRUSTED_PROXY_IPS: ${TIDE_EDGE_PROXY_IP:?Set the exact Edge container IP}
      TIT_DB_POOL_SIZE: ${TIT_API_DB_POOL_SIZE:-5}
      TIT_DB_MAX_OVERFLOW: ${TIT_API_DB_MAX_OVERFLOW:-2}
      TIT_DB_POOL_TIMEOUT_SECONDS: ${TIT_API_DB_POOL_TIMEOUT_SECONDS:-5}
      TIT_DB_POOL_RECYCLE_SECONDS: ${TIT_DB_POOL_RECYCLE_SECONDS:-1800}
      TIT_DB_APPLICATION_NAME: tit-growth-api
      TIT_DB_STATEMENT_TIMEOUT_MS: ${TIT_API_DB_STATEMENT_TIMEOUT_MS:-30000}
      TIT_HEALTHCHECK_HOST: ${TIDE_OPS_HOST:?Set TIDE_OPS_HOST}
    expose:
      - "8010"
    tmpfs:
      - /tmp:size=128m
    pids_limit: 256
    cpus: 1.0
    mem_limit: 1g
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; r=urllib.request.Request('http://127.0.0.1:8010/api/health', headers={'Host': os.environ['TIT_HEALTHCHECK_HOST']}); urllib.request.urlopen(r, timeout=3).read()",
        ]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: *default-logging
    networks:
      - ops-internal
      - edge

  score-settlement:
    <<: *runtime-security
    build:
      context: ../../backend
    env_file:
      - ${TIDE_OPS_ENV_FILE:?Set TIDE_OPS_ENV_FILE to a protected env file}
    environment:
      APP_ENV: production
      TIT_DB_POOL_SIZE: ${TIT_SCORE_WORKER_DB_POOL_SIZE:-1}
      TIT_DB_MAX_OVERFLOW: ${TIT_SCORE_WORKER_DB_MAX_OVERFLOW:-0}
      TIT_DB_POOL_TIMEOUT_SECONDS: ${TIT_SCORE_WORKER_DB_POOL_TIMEOUT_SECONDS:-5}
      TIT_DB_POOL_RECYCLE_SECONDS: ${TIT_DB_POOL_RECYCLE_SECONDS:-1800}
      TIT_DB_APPLICATION_NAME: tit-growth-score-worker
      TIT_DB_STATEMENT_TIMEOUT_MS: ${TIT_SCORE_WORKER_DB_STATEMENT_TIMEOUT_MS:-60000}
    command:
      [
        "python",
        "scripts/settle_shared_task_scores.py",
        "--watch",
        "--max-events",
        "25",
        "--interval-seconds",
        "3",
      ]
    tmpfs:
      - /tmp:size=64m
    pids_limit: 128
    cpus: 0.75
    mem_limit: 768m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "scripts/settle_shared_task_scores.py",
          "--healthcheck",
          "--max-heartbeat-age-seconds",
          "90",
        ]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: *default-logging
    networks:
      - ops-internal

  source-wide:
    <<: *runtime-security
    build:
      context: ../../backend
    env_file:
      - ${TIDE_SOURCE_WORKER_ENV_FILE:?Set TIDE_SOURCE_WORKER_ENV_FILE to a protected source-worker-only env file}
    environment:
      APP_ENV: production
      TIT_MIGRATION_MODE: "false"
      TIT_DB_POOL_SIZE: ${TIT_SOURCE_WORKER_DB_POOL_SIZE:-1}
      TIT_DB_MAX_OVERFLOW: ${TIT_SOURCE_WORKER_DB_MAX_OVERFLOW:-0}
      TIT_DB_POOL_TIMEOUT_SECONDS: ${TIT_SOURCE_WORKER_DB_POOL_TIMEOUT_SECONDS:-5}
      TIT_DB_POOL_RECYCLE_SECONDS: ${TIT_DB_POOL_RECYCLE_SECONDS:-1800}
      TIT_DB_APPLICATION_NAME: tit-growth-source-worker
      TIT_DB_STATEMENT_TIMEOUT_MS: ${TIT_SOURCE_WORKER_DB_STATEMENT_TIMEOUT_MS:-60000}
      TIT_SOURCE_WORKER_HEARTBEAT: /tmp/tit-source-worker-heartbeat
      TIT_SOURCE_WORKER_READINESS: /tmp/tit-source-worker-readiness
    command:
      [
        "python",
        "scripts/run_source_wide_worker.py",
        "--watch",
        "--max-events",
        "25",
        "--interval-seconds",
        "3",
        "--heartbeat-path",
        "/tmp/tit-source-worker-heartbeat",
        "--readiness-path",
        "/tmp/tit-source-worker-readiness",
      ]
    tmpfs:
      - /tmp:size=64m
    pids_limit: 128
    cpus: 0.75
    mem_limit: 768m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "scripts/run_source_wide_worker.py",
          "--healthcheck",
          "--heartbeat-path",
          "/tmp/tit-source-worker-heartbeat",
          "--readiness-path",
          "/tmp/tit-source-worker-readiness",
          "--max-heartbeat-age-seconds",
          "90",
          "--max-readiness-age-seconds",
          "90",
        ]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: *default-logging
    networks:
      - ops-internal

  web:
    <<: *runtime-security
    build:
      context: ../../frontend
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"
    tmpfs:
      - /tmp:size=32m
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
    pids_limit: 64
    cpus: 0.25
    mem_limit: 128m
    logging: *default-logging
    networks:
      - ops-internal
      - edge

  teacher-api:
    <<: *runtime-security
    build:
      context: ${TIDE_TEACHER_REPO_PATH:?Set TIDE_TEACHER_REPO_PATH}/backend
    env_file:
      - ${TIDE_TEACHER_ENV_FILE:?Set TIDE_TEACHER_ENV_FILE to a protected env file}
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_REQUIRED: "true"
      DATABASE_MAX_CONNECTIONS: ${TIT_TEACHER_DB_POOL_SIZE:-5}
      MULTIPART_UPLOAD_MAX_CONCURRENCY: ${TIT_TEACHER_MULTIPART_UPLOAD_MAX_CONCURRENCY:-4}
      # Edge overwrites X-Forwarded-For after validating the company gateway,
      # so the application trusts one and only one HTTP proxy hop.
      TRUST_PROXY_HOPS: "1"
      SHIWEN_READ_MODE: DIRECT_TABLES
      SHIWEN_ALLOW_TIDE_FIXTURE_FALLBACK: "false"
      FILE_STORAGE_PROVIDER: OSS
      BACKGROUND_JOBS_ENABLED: "true"
      TASK_CATALOG_PUBLIC_WRITE: "false"
      VIDEO_PREFETCH_STATE_DIR: /var/lib/tide/video-prefetch-runs
      PUBLIC_APP_URL: https://${TIDE_TEACHER_HOST:?Set TIDE_TEACHER_HOST}
      PUBLIC_API_URL: https://${TIDE_TEACHER_HOST:?Set TIDE_TEACHER_HOST}
      CORS_ORIGINS: https://${TIDE_TEACHER_HOST:?Set TIDE_TEACHER_HOST}
    expose:
      - "3000"
    tmpfs:
      - /tmp:size=256m
    volumes:
      - teacher-job-state:/var/lib/tide/video-prefetch-runs
    pids_limit: 256
    cpus: 1.0
    mem_limit: 1g
    logging: *default-logging
    networks:
      - teacher-internal
      - edge
    # The current teacher source embeds schedulers in the API process. Keep
    # exactly one replica until it provides a dedicated worker entry point.
    deploy:
      replicas: 1

  teacher-web:
    <<: *runtime-security
    build:
      context: ${TIDE_TEACHER_REPO_PATH:?Set TIDE_TEACHER_REPO_PATH}/frontend
      args:
        VITE_PUBLIC_ASSET_BASE_URL: ${TIDE_TEACHER_PUBLIC_ASSET_BASE_URL:?Set an HTTPS public asset base URL}
    depends_on:
      teacher-api:
        condition: service_healthy
    expose:
      - "8080"
    tmpfs:
      - /tmp:size=32m
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
    pids_limit: 64
    cpus: 0.25
    mem_limit: 128m
    logging: *default-logging
    networks:
      - teacher-internal
      - edge

  edge:
    <<: *runtime-security
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
      teacher-web:
        condition: service_healthy
    environment:
      TIDE_OPS_HOST: ${TIDE_OPS_HOST:?Set TIDE_OPS_HOST}
      TIDE_TEACHER_HOST: ${TIDE_TEACHER_HOST:?Set TIDE_TEACHER_HOST}
      TIDE_COMPANY_GATEWAY_CIDR: ${TIDE_COMPANY_GATEWAY_CIDR:?Set the exact trusted company gateway IP/CIDR}
    volumes:
      - ./edge-nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${TIDE_EDGE_BIND_ADDRESS:?Set a loopback or private gateway bind address}:${TIDE_EDGE_HTTP_PORT:-8080}:8080"
    tmpfs:
      - /tmp:size=32m
      - /etc/nginx/conf.d:size=8m
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
    pids_limit: 64
    cpus: 0.25
    mem_limit: 128m
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/_health",
        ]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging: *default-logging
    networks:
      edge:
        ipv4_address: ${TIDE_EDGE_PROXY_IP:?Set TIDE_EDGE_PROXY_IP}

  contract-probe:
    image: postgres:16-alpine
    user: postgres
    env_file:
      - ${TIDE_CONTRACT_PROBE_ENV_FILE:?Set TIDE_CONTRACT_PROBE_ENV_FILE to a protected read-only probe env file}
    environment:
      PGCONNECT_TIMEOUT: "8"
      PGOPTIONS: "-c default_transaction_read_only=on -c statement_timeout=60000 -c lock_timeout=5000"
      TIDE_CONTRACT_PROBE_EXPECTED_DATABASE: ${TIDE_DATABASE_NAME:?Set TIDE_DATABASE_NAME}
      TIDE_CONTRACT_PROBE_REQUIRE_SSL: "true"
    volumes:
      - ./contract-probe.sql:/contract-probe.sql:ro
      - ./run-contract-probe.sh:/run-contract-probe.sh:ro
    entrypoint: ["/bin/sh", "/run-contract-probe.sh"]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *default-logging
    networks:
      - ops-internal
    profiles: ["migration"]

networks:
  edge:
    internal: false
    ipam:
      config:
        - subnet: ${TIDE_EDGE_NETWORK_SUBNET:?Set a non-overlapping private subnet}
  ops-internal:
    # No host ports are published. Outbound access remains required for an
    # externally managed PostgreSQL database.
    internal: false
  teacher-internal:
    # The teacher API also needs outbound OSS, mail, AI, and database access.
    internal: false

volumes:
  teacher-job-state:
